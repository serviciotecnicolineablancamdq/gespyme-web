<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GesPyme - Configuración</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --sidebar-bg: #2b3856;
            --text-color: #333;
            --bg-color: #f4f6f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        /* Scroll vertical fluido optimizado para Android */
        html, body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            min-height: 100vh; 
            overflow-x: hidden; 
            overflow-y: auto !important; 
            width: 100%; 
            flex-direction: row; 
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }
        
        /* Menú lateral forzado a estar oculto por defecto en subpáginas móviles */
        sidebar { 
            width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; 
            position: fixed; height: 100vh; top: 0; left: 0; z-index: 1000; 
            transform: translateX(-100%) !important; 
            transition: transform 0.3s ease;
        }
        sidebar.open { 
            transform: translateX(0) !important; 
        }
        .sidebar-brand { padding: 1.2rem; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .sidebar-menu { list-style: none; padding: 0.5rem 0; overflow-y: auto; flex: 1; max-height: calc(100vh - 160px); }
        .sidebar-menu li a { display: block; padding: 0.6rem 1.2rem; color: #b0c4de; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
        .sidebar-menu li.active > a, .sidebar-menu li a:hover { background-color: rgba(255,255,255,0.1); color: white; }
        .sidebar-menu .sub-item { padding-left: 2.2rem; font-size: 0.85rem; }
        
        /* Botón de ocultar menú en zona baja */
        .sidebar-hide-section {
            padding: 0.8rem 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.15);
        }
        .btn-hide-sidebar {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: #b0c4de;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-hide-sidebar:hover { background: rgba(255, 255, 255, 0.2); color: white; }
        .sidebar-footer { padding: 0.6rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: #a0a0a0; text-align: center; }

        /* Botón hamburguesa superior */
        .menu-toggle {
            background: var(--sidebar-bg); color: white; border: none;
            padding: 0.5rem 0.8rem; border-radius: 4px; font-size: 1.2rem; cursor: pointer; z-index: 1001;
        }

        /* Contenido principal ocupando todo el ancho */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; width: 100%; margin-left: 0 !important; min-height: 100vh; 
        }

        header { background: white; padding: 0.8rem 1.5rem; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .user-profile { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #555; font-weight: 500; }
        
        .container { padding: 2rem; max-width: 1200px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 2rem; align-items: start; }
        @media(max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .config-nav { background: white; border-radius: 8px
