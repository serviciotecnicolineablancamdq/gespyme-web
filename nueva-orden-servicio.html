<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GesPyme - Nueva Cotización</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --sidebar-bg: #2b3856;
            --text-color: #333;
            --bg-color: #f4f6f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        html { height: 100%; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            min-height: 100vh; 
            height: 100%;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Uso de aside en lugar de sidebar personalizado para evitar bloqueos en blanco */
        aside.sidebar { 
            width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; 
            position: fixed; height: 100%; top: 0; left: 0; z-index: 1000; 
            transform: translateX(-100%); 
            transition: transform 0.3s ease;
        }
        aside.sidebar.open { 
            transform: translateX(0); 
        }
        .sidebar-brand { padding: 1.2rem; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .sidebar-menu { list-style: none; padding: 0.5rem 0; overflow-y: auto; flex: 1; }
        .sidebar-menu li a { display: block; padding: 0.6rem 1.2rem; color: #b0c4de; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
        .sidebar-menu li.active a, .sidebar-menu li a:hover { background-color: rgba(255,255,255,0.1); color: white; }
        .sidebar-menu .sub-item { padding-left: 2.2rem; font-size: 0.85rem; }
        
        .sidebar-hide-section {
            padding: 0.8rem 1.2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.15);
        }
        .btn-hide-sidebar {
            width: 100%; background: rgba(255, 255, 255, 0.1); color: #b0c4de;
            border: 1px solid rgba(255, 255, 255, 0.2); padding: 0.5rem; border-radius: 4px;
            cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .sidebar-footer { padding: 0.6rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: #a0a0a0; text-align: center; }

        .menu-toggle {
            background: var(--sidebar-bg); color: white; border: none;
            padding: 0.5rem 0.8rem; border-radius: 4px; font-size: 1.2rem; cursor: pointer; z-index: 1001;
        }

        .main-content { 
            flex: 1; display: flex; flex-direction: column; width: 100%; min-height: 100vh; overflow-y: auto; 
        }

        header { background: white; padding: 0.8rem 1.5rem; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .user-profile { font-size: 0.9rem; color: #555; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        
        .container { padding: 2rem; max-width: 900px; width: 100%; margin: 0 auto; flex: 1; }
        .form-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .form-title { font-size: 1.2rem; font-weight: bold; color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
        label { font-size: 0.85rem; font-weight: 600; color: #555; }
        input, select, textarea { padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; width: 100%; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebarMenu">
        <div class="sidebar-brand"><span>⚙️</span> GesPyme</div>
        <ul class="sidebar-menu">
            <li><a href="index.html">Panel</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="facturas.html">Facturas</a></li>
            <li><a href="cotizaciones.html">Cotizaciones</a></li>
            <li class="active"><a href="nueva-cotizacion.html" class="sub-item">Nueva cotización</a></li>
            <li><a href="articulos.html">Artículos</a></li>
            <li><a href="configuracion.html">Configuración</a></li>
            <li><a href="subscription.html" style="color: #ffd700;">Subscription Pro</a></li>
        </ul>
        <div class="sidebar-hide-section">
            <button class="btn-hide-sidebar" onclick="toggleSidebar()"><span>◀</span> Ocultar Menú</button>
        </div>
        <div class="sidebar-footer">GesPyme © 2026</div>
    </aside>

    <div class="main-content">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <span style="font-weight: bold; font-size: 1rem; color: #1a73e8;">Nueva Cotización</span>
            </div>
            <div class="user-profile" id="userProfileDisplay"><span>👤 Mi Cuenta</span></div>
        </header>

        <div class="container">
            <div class="form-card">
                <div class="form-title">Crear Nueva Cotización / Presupuesto</div>
                <form onsubmit="event.preventDefault(); alert('Cotización guardada con éxito');">
                    <div class="form-group">
                        <label>Cliente / Razón Social:</label>
                        <input type="text" placeholder="Nombre del cliente" required>
                    </div>
                    <div class="form-group">
                        <label>Detalle o Descripción:</label>
                        <textarea placeholder="Descripción del servicio o productos cotizados..." rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Monto Total ($):</label>
                        <input type="number" step="any" placeholder="0.00" required>
                    </div>
                    <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                        <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: 500;">Guardar Cotización</button>
                        <a href="cotizaciones.html" style="background-color: #6c757d; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; text-decoration: none; display: inline-block;">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            let sidebar = document.getElementById("sidebarMenu");
            if (sidebar) sidebar.classList.toggle("open");
        }
        window.onload = function() {
            let usuario = localStorage.getItem("gespyme_usuario");
            if (usuario) document.getElementById("userProfileDisplay").innerHTML = `<span>👤</span> ${usuario}`;
        };
    </script>
</body>
</html>
