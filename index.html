        :root {
            --primary-color: #1a73e8;

        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; min-height: 100vh; overflow-x: hidden; width: 100%; flex-direction: column; }
        
        /* Botón de menú hamburguesa para celulares */
        .menu-toggle {

            padding: 0.5rem 0.8rem; border-radius: 4px; font-size: 1.2rem; cursor: pointer; z-index: 1001;
        }
        @media (max-width: 767px) {
            .menu-toggle { display: inline-block; }

        /* Banner inferior flotante adaptado para no pisar el menú lateral en escritorio */
        #welcome-banner {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            background: linear-gradient(135deg, #1a73e8, #2b3856);
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.25); 
            font-size: 0.85rem; 
            gap: 10px; 
            flex-wrap: wrap;
            z-index: 9999;
        }
        @media (min-width: 768px) {
            #welcome-banner {
                width: calc(100% - 260px);
                left: 260px;
            }
        }
        #welcome-banner .banner-info { display: flex; align-items: center; gap: 10px; }
        #welcome-banner button {
            background: white; color: var(--primary-color); border: none; padding: 6px 14px;
            border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap;
        }

        /* Modales generales */
        #auth-modal, #admin-modal, #pro-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 20000; padding: 15px;

        .auth-card, .admin-card, .pro-card {
            background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px;

        }
        .auth-card h2, .admin-card h2, .pro-card h2 { margin-bottom: 0.5rem; font-size: 1.4rem; }

        .auth-card input, .admin-card select, .admin-card input {
            width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc;
            border-radius: 6px; font-size: 1rem; outline: none;
        }
        .auth-btn {
            width: 100%; background-color: var(--primary-color); color: white; border: none;
            padding: 0.8rem; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        .close-modal { position: absolute; top: 12px; right: 15px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #888; }

        /* Contenedor principal de la app */
        .app-wrapper { display: flex; width: 100%; flex: 1; position: relative; }

        sidebar {

        }
        @media (max-width: 767px) {
            sidebar { transform: translateX(-100%); }
            sidebar.open { transform: translateX(0); }
        }
        .sidebar-brand { padding: 1.2rem; font-size: 1.15rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }

        .sidebar-menu li.active a, .sidebar-menu li a:hover { background-color: rgba(255,255,255,0.1); color: white; }
        .sidebar-menu .sub-item { padding-left: 2.2rem; font-size: 0.9rem; }
        .sidebar-footer { padding: 0.8rem; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem; color: #a0a0a0; text-align: center; }

            .main-content { margin-left: 260px; }
